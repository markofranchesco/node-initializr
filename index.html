/* V3 refinamiento: Spring-like proportions, single page with real Explorer */
.search-top input:focus-visible{outline:0;box-shadow:none}
:root{--rail:10vw;--focus:#2c7b49}
html,body{overflow:hidden}
.shell{width:90%;max-width:none;overflow:visible}
.main{grid-template-rows:109px minmax(0,1fr) 76px}
.workarea{padding:27px 30px 46px;grid-template-columns:50% 50%}
.left-pane{min-height:0;overflow-y:auto;scrollbar-width:thin;padding-right:32px}
.right-pane{padding-left:32px}
.grid-two{column-gap:22px}
.form-group{margin:5px 0 22px}
.form-title,.section-title{font-size:15px;margin-bottom:10px}
.field{margin-bottom:9px;min-height:33px;grid-template-columns:92px minmax(0,1fr);gap:14px}
.field>label,.field>.field-label{font-size:14px}
.field.settings-field{margin-bottom:10px}
.field input:not([type=radio]):not([type=checkbox]){border-bottom-width:3px;outline:0}
.field input:focus:not([type=radio]):not([type=checkbox]){border-bottom-color:var(--text)}
.choice-row{gap:6px 16px}.choice{font-size:14px}
.choice input[type=radio]:focus:not(:focus-visible){outline:none}
.outline-btn{border-radius:3px;min-height:41px;padding:10px 16px;font-size:13px}
.outline-btn:focus:not(:focus-visible),.rail button:focus:not(:focus-visible),.theme-switch button:focus:not(:focus-visible){outline:none}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
.actionbar{gap:14px}.actionbar .outline-btn{min-height:45px;padding:10px 19px}.actionbar #more-button{min-width:56px}
.rail{gap:21px}.rail .github-icon{width:28px;height:28px}
.dialog{width:min(720px,100%);max-height:min(calc(100dvh - 100px),790px)}
#catalog-overlay{align-items:flex-start;padding:clamp(24px,3.5vh,40px) 20px 20px}
.search-top{min-height:46px;padding:0 13px}.search-top input{height:46px}
.catalog-heading{height:41px;padding:11px 11px 9px}
.catalog-item{min-height:70px;padding:12px 13px}
.catalog-copy{gap:7px}.catalog-item .name{font-size:15px}.catalog-item .sub{font-size:14px;line-height:1.45}
.catalog-item:hover{background:var(--dialog-hover);color:var(--text)}
.catalog-item.focused,.catalog-item.focused:hover{background:var(--green);color:white}
.catalog-item.focused .catalog-picked,.catalog-item.focused:hover .catalog-picked{color:white}
.catalog-item[aria-pressed=true]:not(.focused) .catalog-picked{color:var(--green)}
.history-entry .history-text strong{font-size:14px}.history-entry .history-text span{font-size:13px}
.history-entry .history-actions{display:flex;gap:3px}.history-entry button{flex:none}
.history-entry.is-favorite{box-shadow:inset 3px 0 0 var(--green)}
.history-entry .favorite-active{color:var(--green)}
.history-rename-input{width:100%;height:28px;background:var(--panel);color:var(--text);border:1px solid var(--green);padding:4px}
/* Fullscreen Explorer: actual file map, unified with the ZIP */
.explorer-overlay{position:fixed;inset:0;z-index:60;background:var(--background);color:var(--text)}
.explorer-shell{display:grid;grid-template-columns:10vw minmax(0,1fr);width:90%;height:100dvh;border-right:1px solid var(--line)}
.explorer-rail{min-height:0;display:flex;flex-direction:column;align-items:flex-end;padding:23px 25px 14px 0;gap:22px;border-right:1px solid var(--line)}
.explorer-rail button,.explorer-rail a{border:0;background:transparent;color:var(--text);height:40px;width:40px;padding:4px;display:grid;place-items:center;cursor:pointer}
.explorer-rail svg{width:33px;height:33px;fill:none;stroke:currentColor;stroke-width:2.7;stroke-linecap:round}
.explorer-rail .explorer-github{margin-top:auto}.explorer-rail .explorer-github svg{width:28px;height:28px;stroke:none;fill:currentColor}
.explorer-rail-rule{width:37px;border-top:1px solid var(--line)}
.explorer-rail button:hover,.explorer-rail a:hover{color:var(--green)}

/* V12 — animaciones puntuales, sin modificar el diseño ni el generador. */
/* El buscador aparece suavemente y se retira antes de ocultarse. */
@keyframes catalogBackdropIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes catalogBackdropOut { from { opacity: 1; } to { opacity: 0; } }
@keyframes catalogDialogIn { from { opacity: 0; transform: translate3d(0,-22px,0); } to { opacity: 1; transform: translate3d(0,0,0); } }
@keyframes catalogDialogOut { from { opacity: 1; transform: translate3d(0,0,0); } to { opacity: 0; transform: translate3d(0,-16px,0); } }
#catalog-overlay.is-entering { animation: catalogBackdropIn 290ms ease-out both; }
#catalog-overlay.is-entering #catalog-dialog { animation: catalogDialogIn 300ms cubic-bezier(.2,.7,.2,1) both; }
#catalog-overlay.is-exiting { animation: catalogBackdropOut 290ms ease-in both; pointer-events: none; }
#catalog-overlay.is-exiting #catalog-dialog { animation: catalogDialogOut 290ms cubic-bezier(.5,0,.8,.4) both; }
/* Explorer: el menú lateral y los controles de tema quedan estáticos;
   solo el explorador de archivos/editor y su footer suben/bajan. */
.explorer-overlay,
.explorer-overlay.hidden,
.explorer-overlay.is-open {
  transform: none !important;
  will-change: auto;
  transition: none !important;
}
.explorer-overlay:not(.hidden) { visibility: visible; pointer-events: auto; }
.explorer-overlay.hidden { visibility: hidden; pointer-events: none; }
.explorer-overlay { overflow: hidden; }
.explorer-layout,
.explorer-footer {
  transform: translate3d(0,100dvh,0);
  transition: transform 340ms cubic-bezier(.2,.7,.22,1);
  will-change: transform;
}
.explorer-overlay.is-open .explorer-layout,
.explorer-overlay.is-open .explorer-footer { transform: translate3d(0,0,0); }
@media (prefers-reduced-motion: reduce) {
  #catalog-overlay.is-entering, #catalog-overlay.is-entering #catalog-dialog,
  #catalog-overlay.is-exiting, #catalog-overlay.is-exiting #catalog-dialog { animation: none !important; }
  .explorer-layout, .explorer-footer { transition: none !important; }
}

function buildProjectFiles(p){

 const deps={},dev={};const devIds=new Set(['nodemon','eslint','prettier','vitest','jest','supertest']);
 for(const id of p.dependencies||[]){const d=BY_ID[id];if(d)(devIds.has(id)?dev:deps)[d.pkg]=d.version;}
 if(ts){dev.typescript='^5.9.0';dev.tsx='^4.20.0';dev['@types/node']='^24.0.0';}
 if((p.dependencies||[]).includes('prisma'))dev.prisma='^7.0.0';
 const hasNodemon=(p.dependencies||[]).includes('nodemon');
 const scripts={
   dev:ts?(hasNodemon?'nodemon --watch src --ext ts --exec "tsx src/app.ts"':'tsx watch src/app.ts'):(hasNodemon?'nodemon src/app.js':'node --watch src/app.js'),
   start:ts?'node dist/app.js':'node src/app.js'

 const manifest={name:p.name,version:p.version,private:true,description:p.description||'',type:esm?'module':'commonjs',engines:{node:`>=${p.nodeVersion}.0.0`},scripts};
 if(Object.keys(deps).length)manifest.dependencies=Object.fromEntries(Object.entries(deps).sort(([a],[b])=>a.localeCompare(b)));
 if(Object.keys(dev).length)manifest.devDependencies=Object.fromEntries(Object.entries(dev).sort(([a],[b])=>a.localeCompare(b)));
 const files={'.gitignore':'node_modules/\ndist/\n.DS_Store\n','package.json':JSON.stringify(manifest,null,2)+'\n'};
 files[`src/app.${ext}`]=`console.log('Hello world');\n`;
 if(ts)files['tsconfig.json']=JSON.stringify({compilerOptions:{target:'ES2022',module:esm?'NodeNext':'CommonJS',moduleResolution:esm?'NodeNext':'Node',rootDir:'src',outDir:'dist',strict:true,esModuleInterop:true,skipLibCheck:true},include:['src/**/*.ts']},null,2)+'\n';
 if(p.packaging==='docker'||p.packaging==='compose'){
   const commands={npm:{install:'npm install',build:'npm run build',start:'npm run start'},pnpm:{install:'npm install -g pnpm && pnpm install',build:'pnpm run build',start:'pnpm start'},yarn:{install:'npm install -g yarn && yarn install',build:'yarn build',start:'yarn start'}};
   const c=commands[p.packageManager]||commands.npm;
   const docker=['FROM node:'+p.nodeVersion+'-alpine','WORKDIR /app','COPY package.json ./','RUN '+c.install,'COPY . .'];
   if(ts)docker.push('RUN '+c.build);
   docker.push('CMD ["'+(p.packageManager==='npm'?'npm':p.packageManager)+'", "'+(p.packageManager==='yarn'?'start':'run')+'"'+(p.packageManager==='yarn'?'':', "start"')+']');
   files['Dockerfile']=docker.join('\n')+'\n';
   files['.dockerignore']='node_modules\ndist\n.git\n';
   if(p.packaging==='compose')files['compose.yaml']='services:\n  app:\n    build: .\n    restart: "no"\n';
 }
 return files;
}

function highlightCode(line){const re=/(\/\/.*|#.*|"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'|`(?:\\.|[^`\\])*`|\b(?:import|from|export|default|const|let|function|return|async|await|if|else|new|require|true|false|null|type|interface|extends|module|services|environment|build|ports|EXPOSE|FROM|COPY|RUN|CMD|ENV|WORKDIR)\b|\b\d+(?:\.\d+)*\b)/g;let pos=0,output='';for(const m of line.matchAll(re)){output+=htmlEsc(line.slice(pos,m.index));let type=m[0].startsWith('//')||m[0].startsWith('#')?'comment':/^['"`]/.test(m[0])?'string':/^\d/.test(m[0])?'number':'keyword';output+=`<span class="syntax-${type}">${htmlEsc(m[0])}</span>`;pos=m.index+m[0].length}return output+htmlEsc(line.slice(pos))}
function showExplorerFile(path){if(!explorerSnapshot||!Object.hasOwn(explorerSnapshot.files,path))return;explorerActiveFile=path;renderExplorerTree();const content=explorerSnapshot.files[path];const code=$('explorer-code');code.innerHTML=content.replace(/\n$/,'').split('\n').map((line,i)=>`<div class="code-line"><span class="code-number">${i+1}</span><span class="code-text">${highlightCode(line)||' '}</span></div>`).join('');code.parentElement.scrollTop=0;code.parentElement.scrollLeft=0}
function explorerDownload(){if(!explorerSnapshot)return;try{const {config,files}=explorerSnapshot;downloadZip(files,config.name+'.zip',config.name);saveHistory(config);notify(tr('downloaded')+': '+config.name+'.zip')}catch(err){notify('No se pudo descargar el ZIP: '+err.message)}}
async function explorerCopy(){if(!explorerSnapshot)return;const content=explorerSnapshot.files[explorerActiveFile];try{if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(content);else{const tmp=document.createElement('textarea');tmp.value=content;tmp.style.cssText='position:fixed;opacity:0';document.body.append(tmp);tmp.select();if(!document.execCommand('copy'))throw new Error('Permiso denegado');tmp.remove()}notify(tr('copied')+': '+explorerActiveFile)}catch{notify(tr('copyError'))}}
$('explorer-tree').addEventListener('click',event=>{const folder=event.target.closest('[data-folder]'),file=event.target.closest('[data-file]');if(folder){const path=folder.dataset.folder;if(openedFolders.has(path))openedFolders.delete(path);else openedFolders.add(path);renderExplorerTree()}else if(file)showExplorerFile(file.dataset.file)});
$('explorer-close').addEventListener('click',closeExplorer);$('explorer-home').addEventListener('click',closeExplorer);
$('explorer-copy').addEventListener('click',explorerCopy);document.querySelectorAll('[data-explorer-download]').forEach(b=>b.addEventListener('click',explorerDownload));
$('explorer-theme-light').addEventListener('click',()=>setTheme('light'));$('explorer-theme-dark').addEventListener('click',()=>setTheme('dark'));
// Eventos y atajos.
for(const el of document.querySelectorAll('input[type="radio"]'))el.addEventListener('change',e=>{if(!e.target.checked)return;const k=e.target.name;state[k]=e.target.value;persist();renderSelected()});
for(const k of ['name','description','version'])$(k).addEventListener('input',e=>{state[k]=e.target.value;persist();if(['name','version'].includes(k))validate(false)});
$('selected-list').addEventListener('click',e=>{const remove=e.target.closest('[data-remove]'),custom=e.target.closest('[data-remove-custom]');if(remove)toggleDependency(remove.dataset.remove);else if(custom){state.custom.splice(Number(custom.dataset.removeCustom),1);persist();renderSelected()}});
$('theme-light').addEventListener('click',()=>setTheme('light'));
$('theme-dark').addEventListener('click',()=>setTheme('dark'));
for(const id of ['ui-language','explorer-ui-language'])$(id).addEventListener('change',e=>applyLanguage(e.target.value));
$('add-dependencies').addEventListener('click',openCatalog);
$('generate-button').addEventListener('click',generate);$('explore-button').addEventListener('click',openExplorer);
$('menu-button').addEventListener('click',drawer);
$('history-button').addEventListener('click',openHistory);
for(const id of ['close-catalog','close-drawer','close-history'])$(id).addEventListener('click',closeOverlays);
$('dep-search').addEventListener('input',e=>{searchText=e.target.value;catalogIndex=-1;renderCatalog();$('catalog-list').scrollTop=0});
$('catalog-list').addEventListener('click',e=>{const b=e.target.closest('[data-dep]');if(b){catalogIndex=-1;toggleDependency(b.dataset.dep);if(!(e.ctrlKey||e.metaKey))closeOverlays();else $('dep-search').focus({preventScroll:true})}});


$('history-content').addEventListener('click',e=>{
 const btn=e.target.closest('button[data-restore],button[data-delete-history],button[data-rename],button[data-favorite]');if(!btn)return;
 const i=Number(btn.dataset.restore??btn.dataset.deleteHistory??btn.dataset.rename??btn.dataset.favorite),h=history[i];if(!h)return;
 if(btn.hasAttribute('data-restore')){state=normalize(h.state);persist();applyState();closeOverlays();notify(tr('restored'))}
 else if(btn.hasAttribute('data-delete-history')){history.splice(i,1);storageSet(HISTORY_STORE,history);updateHistoryVisible();renderHistory();if(!history.length)closeOverlays()}
 else if(btn.hasAttribute('data-favorite')){h.favorite=!h.favorite;storageSet(HISTORY_STORE,history);renderHistory()}
 else if(btn.hasAttribute('data-rename')){
  const node=btn.closest('.history-entry').querySelector('.history-text strong');const input=document.createElement('input');input.className='history-rename-input';input.value=h.label||h.state.name;node.replaceWith(input);input.focus();input.select();let handled=false;
  const commit=save=>{if(handled)return;handled=true;if(save&&input.value.trim().length<=80&&input.value.trim()){h.label=input.value.trim();storageSet(HISTORY_STORE,history)}renderHistory()};
  input.addEventListener('keydown',event=>{if(event.key==='Enter'){event.preventDefault();commit(true)}if(event.key==='Escape'){event.preventDefault();event.stopPropagation();commit(false)}});input.addEventListener('blur',()=>commit(true));
 }
});
$('clear-history').addEventListener('click',()=>{if(!history.length)return;{history=[];storageSet(HISTORY_STORE,history);updateHistoryVisible();renderHistory();closeOverlays()}});
$('drawer-content').addEventListener('click',e=>{const b=e.target.closest('[data-menu]');if(!b)return;const action=b.dataset.menu;closeOverlays();if(action==='catalog')openCatalog();if(action==='history')openHistory()});
for(const id of OVERLAYS)$(id).addEventListener('click',e=>{if(e.target===$(id))closeOverlays()});
let menuTouchY=0;
$('drawer-overlay').addEventListener('wheel',e=>{if(e.deltaY>8)closeOverlays()},{passive:true});
$('drawer-overlay').addEventListener('touchstart',e=>{menuTouchY=e.touches[0]?.clientY||0},{passive:true});
$('drawer-overlay').addEventListener('touchmove',e=>{if(menuTouchY-(e.touches[0]?.clientY||0)>35)closeOverlays()},{passive:true});
window.addEventListener('keydown',e=>{
 const mod=e.ctrlKey||e.metaKey,editing=!!e.target.closest('input,textarea,select,[contenteditable="true"]'),activeId=OVERLAYS.find(id=>!$(id).classList.contains('hidden'));
 if(explorerVisible()){if(e.key==='Escape'){e.preventDefault();closeExplorer();return}if(mod&&e.key==='Enter'){e.preventDefault();explorerDownload();return}if(mod&&e.code==='Space'){e.preventDefault();closeExplorer();return}if(e.key==='Tab'){const btns=[...$('explorer-overlay').querySelectorAll('button:not([disabled]),a[href]')].filter(n=>n.getClientRects().length);if(btns.length){const first=btns[0],last=btns[btns.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}}return}
 if(e.key==='Escape'&&activeId){e.preventDefault();closeOverlays();return}
 if(mod&&e.key.toLowerCase()==='b'&&!editing){e.preventDefault();closeOverlays();openCatalog();return}
 if(mod&&e.code==='Space'&&!activeId){e.preventDefault();openExplorer();return}
 if(mod&&e.key==='Enter'&&!activeId){e.preventDefault();generate();return}
 if(activeId==='catalog-overlay'&&(!editing||e.target===$('dep-search'))){const results=matchingCatalog();if(e.key==='ArrowDown'){e.preventDefault();catalogIndex=(catalogIndex+1)%Math.max(1,results.length);renderCatalog();setFocusCatalog()}else if(e.key==='ArrowUp'){e.preventDefault();catalogIndex=(catalogIndex-1+Math.max(1,results.length))%Math.max(1,results.length);renderCatalog();setFocusCatalog()}else if(e.key==='Enter'&&results.length){e.preventDefault();if(catalogIndex<0)catalogIndex=0;toggleDependency(results[catalogIndex].id);if(e.ctrlKey||e.metaKey)setFocusCatalog();else closeOverlays()}}
 if(e.key==='Tab'&&activeId){const panel=$(activeId).querySelector('[role="dialog"]');const focusable=[...panel.querySelectorAll('button:not([disabled]),input:not([disabled]),a[href]')].filter(n=>n.getClientRects().length>0);if(focusable.length){const first=focusable[0],last=focusable[focusable.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}}
});

applyState();updateHistoryVisible();applyLanguage(uiLang);
</script>
</body>
</html>
